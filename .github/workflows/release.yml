name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # 태그가 버전의 기준이다. 번들에 같은 값을 박아 둔다.
      - name: 버전 박기
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" Resources/Info.plist

      - run: make dmg

      - name: 릴리스 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 태그를 다시 밀면 이 워크플로가 또 돈다. 이미 있는 릴리스면 파일만 갈아 끼운다.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" build/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" build/*.dmg \
              --title "$GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md \
              --generate-notes \
              --verify-tag
          fi
